<!DOCTYPE html>
<!-- KMBA CLUB 2026 活動小助手（手機優先）｜抽獎頁 lucky/index.html -->
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0066CC" />
  <meta name="format-detection" content="telephone=no" />
  <title>KMBA菁英計畫 2026 — 活動小助手</title>
  <style>
    :root {
      --blue: #0066CC;
      --blue-dark: #004C99;
      --bg: #121A30;
      --card: #FFFFFF;
      --soft: #F4F6FA;
      --mint: #EAFDF8;
      --text: #1A1A1A;
      --muted: #5A6475;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top: env(safe-area-inset-top, 0px);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html {
      -webkit-text-size-adjust: 100%;
      height: 100%;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: var(--bg);
      min-height: 100%;
      min-height: 100dvh;
      color: var(--text);
      overflow: hidden;
      overscroll-behavior: none;
    }
    .app {
      width: 100%;
      height: 100dvh;
      max-height: 100dvh;
      background: var(--card);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .header {
      flex-shrink: 0;
      background: linear-gradient(135deg, var(--blue) 0%, var(--blue-dark) 100%);
      color: #fff;
      padding: calc(12px + var(--safe-top)) 16px 12px;
    }
    .header-top { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .header-text { min-width: 0; flex: 1; }
    .logo {
      width: 44px; height: 44px;
      border-radius: 10px;
      background: #fff;
      flex-shrink: 0;
      overflow: hidden;
    }
    .logo img { width: 100%; height: 100%; object-fit: contain; background: #fff; }
    .header h1 {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .header p {
      font-size: 11px;
      opacity: .88;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .badge {
      display: inline-block;
      margin-top: 8px;
      padding: 3px 9px;
      border-radius: 999px;
      background: rgba(255,255,255,.14);
      font-size: 10px;
    }
    .messages {
      flex: 1 1 auto;
      min-height: 0;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      padding: 14px 12px;
      background: var(--soft);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg-row {
      display: flex;
      align-items: flex-end;
      gap: 6px;
      max-width: 92%;
      min-width: 0;
    }
    .msg-row.bot { align-self: flex-start; width: 100%; max-width: 100%; }
    .msg-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #fff;
      border: 1px solid #E6EBF2;
      object-fit: contain;
      flex-shrink: 0;
      padding: 2px;
    }
    .msg {
      padding: 10px 12px;
      border-radius: 14px;
      line-height: 1.55;
      font-size: 15px;
      white-space: pre-wrap;
      word-break: break-word;
      overflow-wrap: anywhere;
      max-width: 100%;
    }
    .msg-row.bot .msg {
      flex: 1 1 auto;
      min-width: 0;
    }
    .msg.bot .msg-conclusion {
      font-weight: 700;
      color: var(--blue-dark);
      margin-bottom: 8px;
      line-height: 1.5;
    }
    .msg.bot .msg-detail {
      margin-top: 4px;
      line-height: 1.55;
    }
    .msg.bot .msg-reminder {
      margin-top: 10px;
      padding: 8px 10px;
      background: var(--mint);
      border-radius: 8px;
      font-size: 13px;
      color: var(--blue-dark);
      line-height: 1.5;
    }
    .msg.bot .msg-footer {
      margin-top: 10px;
      font-size: 12px;
      color: var(--muted);
    }
    .suggestion-label {
      font-size: 12px;
      color: var(--muted);
      margin-top: 12px;
      margin-bottom: 6px;
      font-weight: 600;
    }
    .suggestion-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-top: 4px;
      max-width: 100%;
    }
    .suggestion-button {
      min-height: 44px;
      padding: 10px 12px;
      border-radius: 10px;
      white-space: normal;
      overflow-wrap: anywhere;
      text-align: left;
      border: 1.5px solid #C5D9F2;
      background: #fff;
      color: var(--blue-dark);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      line-height: 1.4;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .suggestion-button:active {
      background: var(--mint);
      border-color: var(--blue);
    }
    .suggestion-list--options .suggestion-button {
      border-color: var(--blue);
      background: #F0F7FF;
    }
    .next-step {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 10px;
      background: var(--mint);
      font-size: 14px;
      line-height: 1.6;
      color: var(--blue-dark);
    }
    .next-step strong {
      display: block;
      margin-bottom: 4px;
    }
    .answer-feedback {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid #E6EBF2;
    }
    .answer-feedback-title {
      margin: 0 0 8px;
      font-size: 14px;
      line-height: 1.5;
      color: var(--text);
    }
    .answer-feedback-actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    .answer-feedback-actions button {
      min-height: 44px;
      padding: 10px 12px;
      border-radius: 10px;
      white-space: normal;
      overflow-wrap: anywhere;
      text-align: left;
      border: 1.5px solid #C5D9F2;
      background: #fff;
      color: var(--blue-dark);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      line-height: 1.4;
      touch-action: manipulation;
    }
    .answer-feedback-actions button:active:not(:disabled) {
      background: var(--mint);
      border-color: var(--blue);
    }
    .answer-feedback-actions--reasons {
      grid-template-columns: 1fr;
    }
    .answer-feedback-actions button[data-feedback="helpful"] {
      border-color: #2E9E6A;
      color: #1B6B47;
    }
    .answer-feedback-actions button[data-feedback="not-helpful"] {
      border-color: #D96B6B;
      color: #9E3A3A;
    }
    .answer-feedback-actions button:disabled {
      opacity: 0.55;
      cursor: default;
    }
    @media (max-width: 360px) {
      .suggestion-list {
        grid-template-columns: 1fr;
      }
      .answer-feedback-actions {
        grid-template-columns: 1fr;
      }
    }
    .msg-images {
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg-images img {
      width: 100%;
      max-width: 100%;
      height: auto;
      border-radius: 10px;
      border: 1px solid #E6EBF2;
      background: #fff;
      display: block;
      cursor: pointer;
    }
    .msg.bot {
      background: var(--card);
      border: 1px solid #E6EBF2;
      border-bottom-left-radius: 4px;
    }
    .msg.user {
      align-self: flex-end;
      max-width: 85%;
      background: var(--blue);
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg.system {
      align-self: center;
      background: var(--mint);
      color: var(--blue-dark);
      font-size: 12px;
      max-width: 94%;
      text-align: center;
      padding: 8px 12px;
    }
    .typing {
      flex-shrink: 0;
      margin: 0 12px 6px;
      padding: 10px 14px;
      background: var(--card);
      border-radius: 14px;
      border: 1px solid #E6EBF2;
      display: none;
      gap: 4px;
      width: fit-content;
    }
    .typing.show { display: flex; }
    .typing span {
      width: 6px; height: 6px;
      background: var(--blue);
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .typing span:nth-child(2) { animation-delay: .15s; }
    .typing span:nth-child(3) { animation-delay: .3s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: .4; }
      40% { transform: translateY(-4px); opacity: 1; }
    }
    .bottom-panel {
      flex-shrink: 0;
      background: #fff;
      border-top: 2px solid #D7E3F4;
      box-shadow: 0 -4px 16px rgba(0, 76, 153, 0.08);
      padding-bottom: var(--safe-bottom);
    }
    .bottom-panel.chips-hidden .chips,
    .bottom-panel.chips-hidden .chips-label {
      display: none;
    }
    .chips-label {
      padding: 6px 12px 0;
      background: var(--soft);
      font-size: 11px;
      font-weight: 700;
      color: var(--blue-dark);
    }
    .chips {
      padding: 4px 12px 0;
      background: var(--soft);
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
    }
    .chip {
      border: 1.5px solid #C5D9F2;
      background: #fff;
      color: var(--blue-dark);
      padding: 8px 10px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      text-align: left;
      width: 100%;
      min-height: 36px;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      font-family: inherit;
    }
    .chip:active {
      background: var(--mint);
      border-color: var(--blue);
    }
    .chip-sub {
      display: block;
      margin-top: 2px;
      font-size: 10px;
      font-weight: 500;
      color: var(--muted);
      line-height: 1.35;
    }
    .input-area {
      padding: 8px 12px 4px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .input-area input {
      flex: 1;
      min-width: 0;
      border: 1px solid #D7E3F4;
      border-radius: 12px;
      padding: 9px 12px;
      font-size: 16px;
      outline: none;
      font-family: inherit;
      min-height: 40px;
      -webkit-appearance: none;
    }
    .input-area input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 2px rgba(0,102,204,.12);
    }
    .input-area button {
      border: none;
      background: var(--blue);
      color: #fff;
      border-radius: 12px;
      padding: 0 16px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      min-height: 44px;
      min-width: 56px;
      flex-shrink: 0;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .input-area button:active { opacity: .85; }
    .input-area button:disabled { opacity: .5; cursor: not-allowed; }
    .footer-note {
      text-align: center;
      font-size: 10px;
      color: var(--muted);
      padding: 4px 12px 8px;
      line-height: 1.4;
    }
    @media (min-width: 521px) {
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        background: linear-gradient(145deg, var(--bg) 0%, var(--blue-dark) 100%);
      }
      .app {
        width: min(480px, 100%);
        height: min(760px, 92dvh);
        max-height: 92dvh;
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(0,0,0,.3);
      }
      .header { padding-top: 18px; border-radius: 20px 20px 0 0; }
      .header h1 { font-size: 18px; }
      .header p { font-size: 12px; }
    }
    .debug-panel {
      display: none;
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      max-height: 38vh;
      background: rgba(18, 26, 48, 0.96);
      color: #e8eef8;
      font-size: 11px;
      font-family: ui-monospace, Consolas, monospace;
      z-index: 9999;
      border-top: 2px solid #ffb020;
      flex-direction: column;
    }
    .debug-panel.show { display: flex; }
    .debug-panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 10px;
      background: rgba(255, 176, 32, 0.15);
      font-weight: 700;
      color: #ffb020;
      flex-shrink: 0;
    }
    .debug-panel-head button {
      border: 1px solid #ffb020;
      background: transparent;
      color: #ffb020;
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 10px;
      cursor: pointer;
    }
    .debug-panel-body {
      overflow: auto;
      padding: 8px 10px 12px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-all;
    }
    body.debug-mode .app { padding-bottom: 0; }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-top">
        <div class="logo"><img src="kmba-logo.png" alt="KMBA LOGO" /></div>
        <div class="header-text">
          <h1>KMBA CLUB 活動小助手</h1>
          <p>KT&G 大韓菸草 · KMBA菁英計畫 2026</p>
        </div>
      </div>
      <span class="badge">繁體中文｜版本 V.09</span>
    </header>

    <div class="messages" id="messages">
      <div class="msg-row bot">
        <img class="msg-avatar" src="kmba-logo.png" alt="KMBA" />
        <div class="msg bot">
        <div id="welcomeMsg">歡迎使用 KMBA CLUB 活動小助手 👋

你可以直接提問，或點下方快捷按鈕：

「我的積分怎麼算？」
「商品卡怎麼拿？」
「抽獎券怎麼拿？」

若問題較模糊，我會再詢問你想了解的項目。</div>
        <div id="welcomeShortcuts"></div>
        </div>
      </div>
    </div>

    <div class="typing" id="typing"><span></span><span></span><span></span></div>

    <div class="bottom-panel" id="bottomPanel">
      <div class="chips-label">快捷提問</div>
      <div class="chips" id="chips">
        <button type="button" class="chip" data-q="我的積分怎麼算？">
          📊 我的積分怎麼算？
          <span class="chip-sub">各任務 100 分 · 月上限 300 分</span>
        </button>
        <button type="button" class="chip" data-q="商品卡怎麼拿？">
          🎁 商品卡怎麼拿？
          <span class="chip-sub">依每月總積分排行 · 100～500 元</span>
        </button>
        <button type="button" class="chip" data-q="抽獎券怎麼拿？">
          🎟️ 抽獎券怎麼拿？
          <span class="chip-sub">100／200／300 分 · 雙月抽獎</span>
        </button>
      </div>
      <form class="input-area" id="form">
        <input id="input" type="text" enterkeyhint="send" placeholder="輸入問題…" autocomplete="off" maxlength="500" />
        <button type="submit" id="send">送出</button>
      </form>
      <div class="footer-note">繁體中文</div>
    </div>
  </div>

  <div class="debug-panel" id="debugPanel" aria-hidden="true">
    <div class="debug-panel-head">
      <span>KMBA Debug（?debug=1）</span>
      <button type="button" id="debugClear">清除</button>
    </div>
    <div class="debug-panel-body" id="debugBody"></div>
  </div>

  <script src="kb-engine.js"></script>
  <script>
    const messagesEl = document.getElementById('messages');
    const typingEl = document.getElementById('typing');
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const LOGO_SRC = 'kmba-logo.png';
    const KMBA_LOG_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzjTNHPh1mtr7gANezaRj4WC5gTUu-Dm8KzXRtj0ObrlhmxTo_LN_bEnWVUSvwa1ND0GQ/exec';
    const KMBA_APP_VERSION = 'V.09';
    const KMBA_SESSION_KEY = 'kmbaSessionId';
    const KMBA_TRAFFIC_TYPE = (function () {
      try {
        const params = new URLSearchParams(location.search);
        if (params.get('test') === '1' || params.get('debug') === '1') return 'TEST';
      } catch (e) { /* ignore */ }
      return 'USER';
    })();
    const FEEDBACK_REASONS = [
      { id: 'incomplete', label: '答案不完整' },
      { id: 'rule_mismatch', label: '規則跟我知道的不一樣' },
      { id: 'unclear', label: '看不懂' },
      { id: 'not_found', label: '找不到我要問的內容' },
      { id: 'other', label: '其他' },
    ];
    const KMBA_DEBUG = (function () {
      try {
        return new URLSearchParams(location.search).get('debug') === '1';
      } catch (e) {
        return false;
      }
    })();
    const debugPanel = document.getElementById('debugPanel');
    const debugBody = document.getElementById('debugBody');

    function debugLog(title, detail) {
      const line = '[' + new Date().toLocaleTimeString('zh-TW', { hour12: false }) + '] ' + title
        + (detail !== undefined ? '\n' + (typeof detail === 'string' ? detail : JSON.stringify(detail, null, 2)) : '');
      console.log('[KMBA Debug]', title, detail);
      if (!KMBA_DEBUG || !debugBody) return;
      debugBody.textContent = (debugBody.textContent ? debugBody.textContent + '\n\n' : '') + line;
      debugBody.scrollTop = debugBody.scrollHeight;
    }

    if (KMBA_DEBUG) {
      document.body.classList.add('debug-mode');
      if (debugPanel) {
        debugPanel.classList.add('show');
        debugPanel.setAttribute('aria-hidden', 'false');
      }
      debugLog('Debug 模式已啟用', {
        version: KMBA_APP_VERSION,
        endpoint: KMBA_LOG_ENDPOINT,
        note: 'no-cors 無法讀取 GAS 回應，請至 Sheet 確認是否寫入',
      });
      const debugClear = document.getElementById('debugClear');
      if (debugClear) {
        debugClear.addEventListener('click', function () {
          if (debugBody) debugBody.textContent = '';
        });
      }
    }

    function getOrCreateSessionId() {
      let id = sessionStorage.getItem(KMBA_SESSION_KEY);
      if (!id) {
        const random = Math.random().toString(36).slice(2, 8).toUpperCase();
        id = 'KMBA-' + Date.now() + '-' + random;
        sessionStorage.setItem(KMBA_SESSION_KEY, id);
      }
      return id;
    }

    const KMBA_SESSION_ID = getOrCreateSessionId();
    console.log('[KMBA Session]', KMBA_SESSION_ID);

    function createMessageId() {
      const random = Math.random().toString(36).slice(2, 8).toUpperCase();
      return 'KMBA-MSG-' + Date.now() + '-' + random;
    }

    function getAnswerSummary(data) {
      const text = (data && data.conclusion) || (data && data.reply) || '';
      return String(text).replace(/\s+/g, ' ').trim().slice(0, 500);
    }

    function getDeviceInfo() {
      const ua = navigator.userAgent || '';
      let os = 'Other';
      if (/iPhone/i.test(ua)) os = 'iPhone';
      else if (/iPad/i.test(ua)) os = 'iPad';
      else if (/Android/i.test(ua)) os = 'Android';
      else if (/Windows/i.test(ua)) os = 'Windows';
      else if (/Macintosh|Mac OS X/i.test(ua)) os = 'macOS';

      let browser = 'Other';
      if (/Edg\//i.test(ua)) browser = 'Edge';
      else if (/Chrome/i.test(ua) && !/Edg/i.test(ua)) browser = 'Chrome';
      else if (/Firefox/i.test(ua)) browser = 'Firefox';
      else if (/Safari/i.test(ua) && !/Chrome/i.test(ua)) browser = 'Safari';

      return (os + ' / ' + browser).slice(0, 100);
    }

    function shouldLogChat(data) {
      return !!(data && data.intent !== 'feedback');
    }

    function buildLogNote(messageId, data, extra) {
      extra = extra || {};
      const parts = [
        'sessionId=' + KMBA_SESSION_ID,
        'messageId=' + messageId,
        'intent=' + ((data && data.intent) || ''),
        'traffic_type=' + KMBA_TRAFFIC_TYPE,
      ];
      if (extra.feedbackReason) parts.push('feedbackReason=' + extra.feedbackReason);
      return parts.join(';');
    }

    function buildLogUrl(payload) {
      const params = new URLSearchParams();
      ['action', 'sessionId', 'messageId', 'resolved'].forEach(function (key) {
        const value = payload[key];
        if (value !== undefined && value !== null && String(value) !== '') {
          params.append(key, String(value));
        }
      });
      const qs = params.toString();
      return qs ? KMBA_LOG_ENDPOINT + '?' + qs : KMBA_LOG_ENDPOINT;
    }

    async function postChatLog(payload) {
      const url = buildLogUrl(payload);
      console.log(payload.action === 'update' ? '[Update]' : '[Create]', payload);
      console.log('[KMBA Log URL]', url);
      debugLog(payload.action === 'update' ? 'Sheet Update' : 'Sheet Create', {
        url: url,
        sessionId: payload.sessionId,
        messageId: payload.messageId,
        faqId: payload.faqId,
        category: payload.category,
        question: payload.question,
        resolved: payload.resolved,
      });
      try {
        await fetch(url, {
          method: 'POST',
          mode: 'no-cors',
          body: JSON.stringify(payload),
          keepalive: true,
        });
        debugLog('Fetch 已送出', 'no-cors 模式下瀏覽器不會回傳成功/失敗，請至 Google Sheet 確認');
      } catch (error) {
        console.warn('[KMBA Log] 傳送失敗：', error);
        debugLog('Fetch 失敗', String(error));
      }
    }

    async function createChatLog(payload) {
      await postChatLog(payload);
    }

    async function updateChatLog(messageId, resolved, feedbackReason) {
      if (!messageId) {
        console.warn('[KMBA Log] 更新略過：缺少 messageId');
        return;
      }
      const noteParts = [
        'sessionId=' + KMBA_SESSION_ID,
        'messageId=' + messageId,
        'traffic_type=' + KMBA_TRAFFIC_TYPE,
      ];
      if (feedbackReason) noteParts.push('feedbackReason=' + feedbackReason);
      const payload = {
        action: 'update',
        messageId: messageId,
        resolved: resolved,
        timestamp: new Date().toISOString(),
        sessionId: KMBA_SESSION_ID,
        note: noteParts.join(';'),
        feedbackReason: feedbackReason || '',
      };
      await postChatLog(payload);
    }

    function renderFeedbackReasons(wrap, messageId) {
      const reasonWrap = document.createElement('div');
      reasonWrap.className = 'answer-feedback-actions answer-feedback-actions--reasons';
      reasonWrap.dataset.stage = 'reasons';
      const reasonTitle = document.createElement('p');
      reasonTitle.className = 'answer-feedback-title';
      reasonTitle.textContent = '主要原因是？';
      wrap.appendChild(reasonTitle);
      FEEDBACK_REASONS.forEach(function (item) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.dataset.feedbackReason = item.id;
        btn.textContent = item.label;
        reasonWrap.appendChild(btn);
      });
      wrap.appendChild(reasonWrap);
    }

    function renderAnswerFeedback(box, messageId) {
      const wrap = document.createElement('div');
      wrap.className = 'answer-feedback';
      wrap.dataset.messageId = messageId;
      const title = document.createElement('p');
      title.className = 'answer-feedback-title';
      title.textContent = '這個回答有解決你的問題嗎？';
      wrap.appendChild(title);
      const actions = document.createElement('div');
      actions.className = 'answer-feedback-actions';
      actions.dataset.stage = 'main';
      [
        { type: 'helpful', label: '👍 有解決' },
        { type: 'not-helpful', label: '👎 沒解決' },
      ].forEach(function (item) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.dataset.feedback = item.type;
        btn.textContent = item.label;
        actions.appendChild(btn);
      });
      wrap.appendChild(actions);
      box.appendChild(wrap);
    }

    const bottomPanel = document.getElementById('bottomPanel');
    const chipsEl = document.getElementById('chips');
    let hasChatted = false;
    let chipTouchLock = false;

    function setChipsVisible(show) {
      if (!bottomPanel) return;
      bottomPanel.classList.toggle('chips-hidden', !show);
    }

    function triggerChipSend(btn) {
      if (!btn || chipTouchLock) return;
      const q = btn.getAttribute('data-q') || '';
      if (!q) return;
      chipTouchLock = true;
      sendMessage(q);
      setTimeout(function () { chipTouchLock = false; }, 400);
    }

    function scrollToBottom() {
      requestAnimationFrame(function () {
        messagesEl.scrollTop = messagesEl.scrollHeight;
      });
    }

    function scrollToBotReply(row) {
      if (!row) return;
      requestAnimationFrame(function () {
        row.scrollIntoView({ block: 'start', behavior: 'smooth' });
      });
    }

    function truncateLabel(text) {
      const t = (text || '').trim();
      return t.length > 18 ? t.slice(0, 18) : t;
    }

    function buildButtonList(items, className, onClick) {
      if (!items || !items.length) return null;
      const wrap = document.createElement('div');
      wrap.className = 'suggestion-list' + (className ? ' ' + className : '');
      items.forEach(function (label) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'suggestion-button';
        btn.textContent = truncateLabel(label);
        btn.title = label;
        btn.addEventListener('pointerdown', function (e) {
          e.preventDefault();
          onClick(label);
        });
        wrap.appendChild(btn);
      });
      return wrap;
    }

    function addBotMsg(data, meta) {
      meta = meta || {};
      const row = document.createElement('div');
      row.className = 'msg-row bot';
      const avatar = document.createElement('img');
      avatar.className = 'msg-avatar';
      avatar.src = LOGO_SRC;
      avatar.alt = 'KMBA';
      row.appendChild(avatar);

      const box = document.createElement('div');
      box.className = 'msg bot';

      if (data && data.conclusion) {
        const conclusion = document.createElement('div');
        conclusion.className = 'msg-conclusion';
        conclusion.textContent = data.conclusion;
        box.appendChild(conclusion);
      }

      if (data && data.details && data.details.length) {
        const detail = document.createElement('div');
        detail.className = 'msg-detail';
        detail.textContent = data.details.join('\n');
        box.appendChild(detail);
      } else if (data && data.reply && !data.conclusion) {
        const plain = document.createElement('div');
        plain.textContent = data.reply;
        box.appendChild(plain);
      }

      if (data && data.images && data.images.length) {
        const gallery = document.createElement('div');
        gallery.className = 'msg-images';
        data.images.forEach(function (item) {
          const img = document.createElement('img');
          img.src = item.src || item;
          img.alt = item.alt || '新品知識圖';
          img.loading = 'lazy';
          img.addEventListener('click', function () {
            window.open(img.src, '_blank', 'noopener');
          });
          gallery.appendChild(img);
        });
        box.appendChild(gallery);
      }

      if (data && data.reminder) {
        const reminder = document.createElement('div');
        reminder.className = 'msg-reminder';
        reminder.textContent = data.reminder;
        box.appendChild(reminder);
      }

      if (data && data.nextStep) {
        const next = document.createElement('div');
        next.className = 'next-step';
        next.innerHTML = '<strong>接下來可以：</strong><span></span>';
        next.querySelector('span').textContent = data.nextStep;
        box.appendChild(next);
      }

      if (data && data.options && data.options.length) {
        const optLabel = document.createElement('div');
        optLabel.className = 'suggestion-label';
        optLabel.textContent = '請選擇';
        box.appendChild(optLabel);
        box.appendChild(buildButtonList(data.options, 'suggestion-list--options', sendMessage));
      }

      if (data && data.suggestions && data.suggestions.length) {
        const sugLabel = document.createElement('div');
        sugLabel.className = 'suggestion-label';
        sugLabel.textContent = '猜你想問';
        box.appendChild(sugLabel);
        box.appendChild(buildButtonList(data.suggestions, '', sendMessage));
      }

      if (data && data.showFeedback && meta.messageId) {
        renderAnswerFeedback(box, meta.messageId);
      }

      if (data && data.reply && data.conclusion && data.showFeedback) {
        const footer = document.createElement('div');
        footer.className = 'msg-footer';
        footer.textContent = '如需協助請聯繫區域業務 📞';
        box.appendChild(footer);
      }

      row.appendChild(box);
      messagesEl.appendChild(row);
      scrollToBotReply(row);
    }

    function addMsg(text, role) {
      if (role === 'system') {
        const div = document.createElement('div');
        div.className = 'msg system';
        div.textContent = text;
        messagesEl.appendChild(div);
      } else if (role === 'user') {
        const div = document.createElement('div');
        div.className = 'msg user';
        div.textContent = text;
        messagesEl.appendChild(div);
      } else {
        const row = document.createElement('div');
        row.className = 'msg-row bot';
        const avatar = document.createElement('img');
        avatar.className = 'msg-avatar';
        avatar.src = LOGO_SRC;
        avatar.alt = 'KMBA';
        row.appendChild(avatar);
        const div = document.createElement('div');
        div.className = 'msg bot';
        div.textContent = text;
        row.appendChild(div);
        messagesEl.appendChild(row);
      }
      scrollToBottom();
    }

    function setLoading(on) {
      typingEl.classList.toggle('show', on);
      sendBtn.disabled = on;
      input.disabled = on;
      if (on) scrollToBottom();
    }

    function sendMessage(text) {
      const q = (text || '').trim();
      if (!q) return;

      const code = q.toLowerCase();
      if (code === 'luckydrawlist' || code === 'luckydrawsetting') {
        addMsg(q, 'user');
        input.value = '';
        addMsg('🍀 幸運星通道開啟中…', 'system');
        const dest = code === 'luckydrawsetting' ? 'lucky/index.html' : 'lucky/index.html?view=1';
        setTimeout(function () { window.location.href = dest; }, 700);
        return;
      }

      const messageId = createMessageId();

      addMsg(q, 'user');
      input.value = '';
      hasChatted = true;
      setLoading(true);
      setTimeout(function () {
        if (typeof KB !== 'undefined' && KB.answer) {
          const data = KB.answer(q);
          debugLog('FAQ 回答', {
            question: q,
            faqId: data.faqId,
            category: data.category,
            intent: data.intent,
            conclusion: getAnswerSummary(data),
          });
          addBotMsg(data, { messageId: messageId, question: q });
          if (shouldLogChat(data)) {
            const payload = {
              action: 'create',
              timestamp: new Date().toISOString(),
              sessionId: KMBA_SESSION_ID,
              messageId: messageId,
              question: q,
              answer: getAnswerSummary(data),
              faqId: data.faqId || data.intent || 'unknown',
              category: data.category || data.optionTopic || 'unknown',
              resolved: '',
              device: getDeviceInfo(),
              version: KMBA_APP_VERSION,
              note: buildLogNote(messageId, data),
              row: [
                new Date().toISOString(),
                KMBA_SESSION_ID,
                q,
                getAnswerSummary(data),
                data.faqId || data.intent || 'unknown',
                data.category || data.optionTopic || 'unknown',
                '',
                getDeviceInfo(),
                KMBA_APP_VERSION,
                buildLogNote(messageId, data),
              ],
            };
            createChatLog(payload);
          }
        } else {
          addMsg('系統載入中，請重新整理後再試。', 'system');
        }
        setLoading(false);
      }, 280);
    }

    messagesEl.addEventListener('click', function (event) {
      const button = event.target.closest('button');
      if (!button || button.disabled) return;
      const feedbackBox = button.closest('.answer-feedback');
      if (!feedbackBox || feedbackBox.dataset.submitted === '1') return;

      if (button.dataset.feedbackReason) {
        feedbackBox.dataset.submitted = '1';
        feedbackBox.querySelectorAll('button').forEach(function (item) { item.disabled = true; });
        const messageId = feedbackBox.dataset.messageId;
        const reason = button.dataset.feedbackReason;
        updateChatLog(messageId, 'NO', reason);
        setLoading(true);
        setTimeout(function () {
          if (typeof KB !== 'undefined' && KB.handleFeedback) {
            addBotMsg(KB.handleFeedback('more'));
          }
          setLoading(false);
        }, 200);
        return;
      }

      if (!button.dataset.feedback) return;

      const type = button.dataset.feedback;
      const messageId = feedbackBox.dataset.messageId;
      const mainActions = feedbackBox.querySelector('[data-stage="main"]');

      if (type === 'helpful') {
        feedbackBox.dataset.submitted = '1';
        feedbackBox.querySelectorAll('button').forEach(function (item) { item.disabled = true; });
        updateChatLog(messageId, 'YES');
        setLoading(true);
        setTimeout(function () {
          if (typeof KB !== 'undefined' && KB.handleFeedback) {
            addBotMsg(KB.handleFeedback('resolved'));
          }
          setLoading(false);
        }, 200);
        return;
      }

      if (type === 'not-helpful') {
        if (mainActions) mainActions.querySelectorAll('button').forEach(function (item) { item.disabled = true; });
        renderFeedbackReasons(feedbackBox, messageId);
        scrollToBottom();
      }
    });

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      sendMessage(input.value);
    });

    if (chipsEl) {
      chipsEl.addEventListener('pointerdown', function (event) {
        const btn = event.target.closest('.chip');
        if (!btn) return;
        event.preventDefault();
        if (input && document.activeElement === input) input.blur();
        triggerChipSend(btn);
      });
    }

    (function renderWelcomeShortcuts() {
      var host = document.getElementById('welcomeShortcuts');
      if (!host) return;
      var label = document.createElement('div');
      label.className = 'suggestion-label';
      label.textContent = '熱門問題';
      host.appendChild(label);
      host.appendChild(buildButtonList(
        ['我的積分怎麼算？', '商品卡怎麼拿？', '抽獎券怎麼拿？', '9月新品是什麼？', '雙月抽獎怎麼玩？'],
        'suggestion-list--options',
        sendMessage
      ));
    })();

    input.addEventListener('focus', function () {
      setChipsVisible(true);
      scrollToBottom();
    });
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', scrollToBottom);
    }
  </script>
</body>
</html>
