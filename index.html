<!DOCTYPE html>
<!-- KMBA AI 智慧客服（手機優先）｜抽獎頁 lucky/index.html -->
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0066CC" />
  <meta name="format-detection" content="telephone=no" />
  <title>KMBA菁英計畫 2026 — 智慧客服</title>
  <style>
    :root {
      --blue: #0066CC;
      --blue-dark: #004C99;
      --bg: #121A30;
      --card: #FFFFFF;
      --soft: #F4F6FA;
      --mint: #EAFDF8;
      --text: #1A1A1A;
      --muted: #5A6475;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top: env(safe-area-inset-top, 0px);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html {
      -webkit-text-size-adjust: 100%;
      height: 100%;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: var(--bg);
      min-height: 100%;
      min-height: 100dvh;
      color: var(--text);
      overflow: hidden;
      overscroll-behavior: none;
    }
    .app {
      width: 100%;
      height: 100dvh;
      max-height: 100dvh;
      background: var(--card);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .header {
      flex-shrink: 0;
      background: linear-gradient(135deg, var(--blue) 0%, var(--blue-dark) 100%);
      color: #fff;
      padding: calc(12px + var(--safe-top)) 16px 12px;
    }
    .header-top { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .header-text { min-width: 0; flex: 1; }
    .logo {
      width: 44px; height: 44px;
      border-radius: 10px;
      background: #fff;
      flex-shrink: 0;
      overflow: hidden;
    }
    .logo img { width: 100%; height: 100%; object-fit: contain; background: #fff; }
    .header h1 {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .header p {
      font-size: 11px;
      opacity: .88;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .badge {
      display: inline-block;
      margin-top: 8px;
      padding: 3px 9px;
      border-radius: 999px;
      background: rgba(255,255,255,.14);
      font-size: 10px;
    }
    .messages {
      flex: 1 1 auto;
      min-height: 0;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      padding: 14px 12px;
      background: var(--soft);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg-row {
      display: flex;
      align-items: flex-end;
      gap: 6px;
      max-width: 92%;
      min-width: 0;
    }
    .msg-row.bot { align-self: flex-start; width: 100%; max-width: 100%; }
    .msg-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #fff;
      border: 1px solid #E6EBF2;
      object-fit: contain;
      flex-shrink: 0;
      padding: 2px;
    }
    .msg {
      padding: 10px 12px;
      border-radius: 14px;
      line-height: 1.55;
      font-size: 15px;
      white-space: pre-wrap;
      word-break: break-word;
      overflow-wrap: anywhere;
      max-width: 100%;
    }
    .msg-row.bot .msg {
      flex: 1 1 auto;
      min-width: 0;
    }
    .msg.bot {
      background: var(--card);
      border: 1px solid #E6EBF2;
      border-bottom-left-radius: 4px;
    }
    .msg.user {
      align-self: flex-end;
      max-width: 85%;
      background: var(--blue);
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg.system {
      align-self: center;
      background: var(--mint);
      color: var(--blue-dark);
      font-size: 12px;
      max-width: 94%;
      text-align: center;
      padding: 8px 12px;
    }
    .typing {
      flex-shrink: 0;
      margin: 0 12px 6px;
      padding: 10px 14px;
      background: var(--card);
      border-radius: 14px;
      border: 1px solid #E6EBF2;
      display: none;
      gap: 4px;
      width: fit-content;
    }
    .typing.show { display: flex; }
    .typing span {
      width: 6px; height: 6px;
      background: var(--blue);
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .typing span:nth-child(2) { animation-delay: .15s; }
    .typing span:nth-child(3) { animation-delay: .3s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: .4; }
      40% { transform: translateY(-4px); opacity: 1; }
    }
    .bottom-panel {
      flex-shrink: 0;
      background: #fff;
      border-top: 1px solid #EEF2F7;
      padding-bottom: var(--safe-bottom);
    }
    .chips {
      padding: 8px 12px 0;
      background: var(--soft);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .chips.chips--hidden { display: none; }
    .chip {
      border: 1.5px solid #C5D9F2;
      background: #fff;
      color: var(--blue-dark);
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      text-align: left;
      width: 100%;
      min-height: 48px;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      font-family: inherit;
    }
    .chip:active {
      background: var(--mint);
      border-color: var(--blue);
    }
    .chip-sub {
      display: block;
      margin-top: 3px;
      font-size: 11px;
      font-weight: 500;
      color: var(--muted);
      line-height: 1.4;
    }
    .input-area {
      padding: 10px 12px 6px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .input-area input {
      flex: 1;
      min-width: 0;
      border: 1px solid #D7E3F4;
      border-radius: 12px;
      padding: 11px 12px;
      font-size: 16px;
      outline: none;
      font-family: inherit;
      min-height: 44px;
      -webkit-appearance: none;
    }
    .input-area input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 2px rgba(0,102,204,.12);
    }
    .input-area button {
      border: none;
      background: var(--blue);
      color: #fff;
      border-radius: 12px;
      padding: 0 16px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      min-height: 44px;
      min-width: 56px;
      flex-shrink: 0;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .input-area button:active { opacity: .85; }
    .input-area button:disabled { opacity: .5; cursor: not-allowed; }
    .footer-note {
      text-align: center;
      font-size: 10px;
      color: var(--muted);
      padding: 4px 12px 8px;
      line-height: 1.4;
    }
    @media (min-width: 521px) {
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        background: linear-gradient(145deg, var(--bg) 0%, var(--blue-dark) 100%);
      }
      .app {
        width: min(480px, 100%);
        height: min(760px, 92dvh);
        max-height: 92dvh;
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(0,0,0,.3);
      }
      .header { padding-top: 18px; border-radius: 20px 20px 0 0; }
      .header h1 { font-size: 18px; }
      .header p { font-size: 12px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-top">
        <div class="logo"><img src="kmba-logo.png" alt="KMBA LOGO" /></div>
        <div class="header-text">
          <h1>KMBA菁英計畫 智慧客服</h1>
          <p>KT&G 大韓菸草 · 活動顧問</p>
        </div>
      </div>
      <span class="badge">繁體中/英文｜版本V.0723</span>
    </header>

    <div class="messages" id="messages">
      <div class="msg-row bot">
        <img class="msg-avatar" src="kmba-logo.png" alt="KMBA" />
        <div class="msg bot">您好，我是 KMBA 智慧客服 👋

可協助了解任務類型與獎勵內容
請輸入問題，或點選下方分類 👇</div>
      </div>
    </div>

    <div class="typing" id="typing"><span></span><span></span><span></span></div>

    <div class="bottom-panel">
      <div class="chips" id="chips">
        <button type="button" class="chip" data-q="任務類型解說">
          📋 任務類型解說
          <span class="chip-sub">常態任務 · 拜訪任務 · 積分規則</span>
        </button>
        <button type="button" class="chip" data-q="獎勵有哪些">
          🎁 獎勵有哪些
          <span class="chip-sub">商品卡 100～500 元 · 抽獎券 · 雙月抽獎</span>
        </button>
      </div>
      <form class="input-area" id="form">
        <input id="input" type="text" enterkeyhint="send" placeholder="輸入問題…" autocomplete="off" maxlength="500" />
        <button type="submit" id="send">送出</button>
      </form>
      <div class="footer-note">繁中／English</div>
    </div>
  </div>

  <script src="kb-engine.js"></script>
  <script>
    const messagesEl = document.getElementById('messages');
    const typingEl = document.getElementById('typing');
    const chipsEl = document.getElementById('chips');
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const LOGO_SRC = 'kmba-logo.png';
    let chipsHidden = false;

    function scrollToBottom() {
      requestAnimationFrame(function () {
        messagesEl.scrollTop = messagesEl.scrollHeight;
      });
    }

    function hideChips() {
      if (!chipsHidden) {
        chipsEl.classList.add('chips--hidden');
        chipsHidden = true;
      }
    }

    function addMsg(text, role) {
      if (role === 'system') {
        const div = document.createElement('div');
        div.className = 'msg system';
        div.textContent = text;
        messagesEl.appendChild(div);
      } else if (role === 'user') {
        const div = document.createElement('div');
        div.className = 'msg user';
        div.textContent = text;
        messagesEl.appendChild(div);
      } else {
        const row = document.createElement('div');
        row.className = 'msg-row bot';
        const avatar = document.createElement('img');
        avatar.className = 'msg-avatar';
        avatar.src = LOGO_SRC;
        avatar.alt = 'KMBA';
        row.appendChild(avatar);
        const div = document.createElement('div');
        div.className = 'msg bot';
        div.textContent = text;
        row.appendChild(div);
        messagesEl.appendChild(row);
      }
      scrollToBottom();
    }

    function setLoading(on) {
      typingEl.classList.toggle('show', on);
      sendBtn.disabled = on;
      input.disabled = on;
      if (on) scrollToBottom();
    }

    function sendMessage(text) {
      const q = (text || '').trim();
      if (!q) return;

      const code = q.toLowerCase();
      if (code === 'luckydrawlist' || code === 'luckydrawsetting') {
        addMsg(q, 'user');
        input.value = '';
        addMsg('🍀 幸運星通道開啟中…', 'system');
        hideChips();
        const dest = code === 'luckydrawsetting' ? 'lucky/index.html' : 'lucky/index.html?view=1';
        setTimeout(function () { window.location.href = dest; }, 700);
        return;
      }

      addMsg(q, 'user');
      input.value = '';
      hideChips();
      setLoading(true);
      setTimeout(function () {
        if (typeof KB !== 'undefined' && KB.answer) {
          const data = KB.answer(q);
          addMsg(data.reply || '暫時無法回覆，請稍後再試。', 'bot');
        } else {
          addMsg('系統載入中，請重新整理後再試。', 'system');
        }
        setLoading(false);
      }, 280);
    }

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      sendMessage(input.value);
    });

    document.querySelectorAll('.chip').forEach(function (btn) {
      btn.addEventListener('click', function () {
        sendMessage(btn.getAttribute('data-q') || '');
      });
    });

    input.addEventListener('focus', scrollToBottom);
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', scrollToBottom);
    }
  </script>
</body>
</html>
